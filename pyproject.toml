[project]
name = "procgen"
version = "0.1.0"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "realmgen*", "utils*", "viz*", "worldgen*"]

[tool.flake8]
max-line-length = 120
exclude = [".venv", "__pycache__"]

[tool.pytest.ini_options]
testpaths = ["core", "viz", "worldgen", "realmgen"]


[tool.pyright]
extraPaths = ["worldgen", "scripts"]
venvPath = "."
venv = ".venv"
